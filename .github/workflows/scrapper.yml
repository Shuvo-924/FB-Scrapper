name: Facebook Train Post Scraper

on:
  workflow_dispatch:
    inputs:
      max_scrolls:
        description: 'Number of scrolls to perform'
        required: true
        default: '1500'
      keywords:
        description: 'Comma-separated keywords to filter'
        required: true
        default: 'ঢাকা,সিলেট,কমলাপুর,শায়েস্তাগঞ্জ,dhaka,sylhet,kamlapur,shaistaganj,kamalapur'
      page_url:
        description: 'Facebook page URL'
        required: true
        default: 'https://www.facebook.com/KalniBR'

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright pandas
          fi
          playwright install chromium --with-deps

      - name: Clean stale trigger file
        run: |
          # Ensure no leftover trigger from an earlier cancelled run exists
          rm -f trigger_next.txt

      - name: Restore Facebook Session
        env:
          FB_STORAGE_STATE: ${{ secrets.FB_STORAGE_STATE }}
        run: |
          if [ ! -f storage_state.json ] && [ -n "$FB_STORAGE_STATE" ]; then
            echo "$FB_STORAGE_STATE" > storage_state.json
            echo "✓ Restored storage_state.json from GitHub Secrets."
          fi

      - name: Run Scraper in Xvfb
        env:
          CI: "true"
          PYTHONUNBUFFERED: "1"
          PAGE_URL: ${{ github.event.inputs.page_url }}
          MAX_SCROLLS: ${{ github.event.inputs.max_scrolls }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
          SCROLL_WAIT_MS: "2500"
          MAX_RUNTIME_MINUTES: "325"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u scrapper.py

      - name: Upload Scraped Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-scraped-posts-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Commit State & Push Data to Branch
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only commit data and session. NEVER commit trigger_next.txt!
          git add output/ storage_state.json checkpoint.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore: save scraping checkpoint & session [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # -------------------------------------------------------------
      # ONLY auto-trigger if scraper completed cleanly (SKIPPED IF CANCELLED)
      # -------------------------------------------------------------
      - name: Auto-Trigger Next GitHub Action
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "trigger_next.txt" ]; then
            REMAINING=$(cat trigger_next.txt)
            echo "=========================================================="
            echo "🔄 Time budget reached. Auto-chaining next run for $REMAINING scrolls..."
            echo "=========================================================="
            rm -f trigger_next.txt
            gh workflow run scrapper.yml -f max_scrolls="$REMAINING" -f keywords="${{ github.event.inputs.keywords }}" -f page_url="${{ github.event.inputs.page_url }}"
          else
            echo "✓ Finished target scrolls or stopped normally."
          fi
